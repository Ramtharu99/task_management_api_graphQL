$kind: http-request
description: "The task was deleted by Tasks \u2192 Delete Task \u2192 NOT_FOUND."
method: POST
url: '{{baseUrl}}/graphql'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "query Task($id: ID!) { task(id: $id) { id } }",
      "variables": {
        "id": "{{taskId}}"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('error code is NOT_FOUND', () => pm.expect(json.errors[0].extensions.code).to.eql('NOT_FOUND'));
