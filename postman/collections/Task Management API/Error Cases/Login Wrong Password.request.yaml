$kind: http-request
method: POST
url: '{{baseUrl}}/graphql'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "mutation Login($input: LoginInput!) { login(input: $input) { token user { id name email } } }",
      "variables": {
        "input": {
          "email": "{{email}}",
          "password": "wrong-password"
        }
      }
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('error code is UNAUTHENTICATED', () => pm.expect(json.errors[0].extensions.code).to.eql('UNAUTHENTICATED'));
