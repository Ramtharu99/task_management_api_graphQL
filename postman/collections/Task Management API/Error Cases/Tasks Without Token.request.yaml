$kind: http-request
description: "No Authorization header \u2192 UNAUTHENTICATED."
method: POST
url: '{{baseUrl}}/graphql'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "query { tasks { id } }"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('error code is UNAUTHENTICATED', () => pm.expect(json.errors[0].extensions.code).to.eql('UNAUTHENTICATED'));
