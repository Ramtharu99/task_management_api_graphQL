$kind: http-request
method: POST
url: '{{baseUrl}}/graphql'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "query Task($id: ID!) { task(id: $id) { id title description completed priority dueDate } }",
      "variables": {
        "id": "{{taskId}}"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('no GraphQL errors', () => pm.expect(json.errors, JSON.stringify(json.errors)).to.be.undefined);
      pm.test('returns the requested task', () => pm.expect(json.data.task.id).to.eql(pm.collectionVariables.get('taskId')));
