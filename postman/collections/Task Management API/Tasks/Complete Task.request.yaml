$kind: http-request
method: POST
url: '{{baseUrl}}/graphql'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "mutation CompleteTask($id: ID!) { completeTask(id: $id) { id title completed } }",
      "variables": {
        "id": "{{taskId}}"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('no GraphQL errors', () => pm.expect(json.errors, JSON.stringify(json.errors)).to.be.undefined);
      pm.test('task is completed', () => pm.expect(json.data.completeTask.completed).to.eql(true));
