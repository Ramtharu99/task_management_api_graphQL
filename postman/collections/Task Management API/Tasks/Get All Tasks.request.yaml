$kind: http-request
description: "All of your tasks, newest first."
method: POST
url: '{{baseUrl}}/graphql'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "query Tasks { tasks { id title description completed priority dueDate createdAt updatedAt } }"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('no GraphQL errors', () => pm.expect(json.errors, JSON.stringify(json.errors)).to.be.undefined);
      pm.test('includes the created task', () => pm.expect(json.data.tasks.map(t => t.id)).to.include(pm.collectionVariables.get('taskId')));
